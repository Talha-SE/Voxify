<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SONUS{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}SONUS offers fast and secure speech-to-text tools with flexible membership and one-time plans.{% endblock %}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}SONUS{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Modern voice productivity platform with private and secure architecture.{% endblock %}">
  <meta property="og:site_name" content="SONUS">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="site-bg" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="grid-overlay"></div>
  </div>

  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">
      <span class="brand-dot"></span>
      <span>SONUS</span>
    </a>
    <nav class="nav-links" aria-label="Primary">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('privacy_policy') }}">Privacy</a>
      <a href="{{ url_for('terms_and_conditions') }}">Terms</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Copyright {{ current_year }} SONUS by Brevios.com</p>
    <a class="admin-hint" href="{{ url_for('admin_login') }}">Admin</a>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
