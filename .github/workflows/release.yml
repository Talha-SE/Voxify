name: Build and Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voxify-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    env:
      WINDOWS_SIGN_PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX_B64 }}
      WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Prepare Windows signing certificate
        if: ${{ env.WINDOWS_SIGN_PFX_B64 != '' && env.WINDOWS_SIGN_PFX_PASSWORD != '' }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'voxify-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX_B64))
          Add-Content -Path $env:GITHUB_ENV -Value "SIGN_PFX_PATH=$pfxPath"
          Add-Content -Path $env:GITHUB_ENV -Value "SIGN_PFX_PASSWORD=$env:WINDOWS_SIGN_PFX_PASSWORD"

      - name: Build Windows package
        shell: cmd
        run: build.bat <nul

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/Voxify-v*-windows.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS release
    runs-on: macos-latest
    env:
      MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PortAudio
        run: |
          brew install portaudio
          echo "PKG_CONFIG_PATH=$(brew --prefix portaudio)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$(brew --prefix portaudio)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix portaudio)/lib" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt

      - name: Import macOS signing certificate
        if: ${{ env.MACOS_CERT_BASE64 != '' && env.MACOS_CERT_PASSWORD != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ env.MACOS_CERT_BASE64 }}
          p12-password: ${{ env.MACOS_CERT_PASSWORD }}

      - name: Detect macOS signing identity
        if: ${{ env.MACOS_CERT_BASE64 != '' && env.MACOS_CERT_PASSWORD != '' }}
        shell: bash
        run: |
          IDENTITY="$(security find-identity -v -p codesigning | awk -F'"' 'NR==1 {print $2}')"
          echo "APPLE_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build macOS package
        shell: bash
        run: chmod +x build_macos.sh && ./build_macos.sh

      - name: Upload macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release/Voxify-v*-macos.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-dev pkg-config libasound2-dev

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt

      - name: Build Linux package
        shell: bash
        run: chmod +x build_linux.sh && ./build_linux.sh

      - name: Upload Linux zip
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/Voxify-v*-linux.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
      - build-linux
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Clean release directory
        shell: bash
        run: rm -f release/*.zip

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Resolve release tag
        shell: bash
        run: |
          RELEASE_FILE="$(ls release/Voxify-v*-windows.zip | head -n 1)"
          RELEASE_BASENAME="$(basename "$RELEASE_FILE")"
          RELEASE_TAG="${RELEASE_BASENAME#Voxify-}"
          RELEASE_TAG="${RELEASE_TAG%-windows.zip}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Verify release files
        shell: bash
        run: ls -lah release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*.zip
