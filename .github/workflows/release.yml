name: Build and Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voxify-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Prepare Windows signing certificate
        if: ${{ secrets.WINDOWS_SIGN_PFX_B64 != '' && secrets.WINDOWS_SIGN_PFX_PASSWORD != '' }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'voxify-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String('${{ secrets.WINDOWS_SIGN_PFX_B64 }}'))
          Add-Content -Path $env:GITHUB_ENV -Value "SIGN_PFX_PATH=$pfxPath"
          Add-Content -Path $env:GITHUB_ENV -Value "SIGN_PFX_PASSWORD=${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}"

      - name: Build Windows package
        shell: cmd
        run: build.bat <nul

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/Voxify-v*-windows.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt

      - name: Import macOS signing certificate
        if: ${{ secrets.MACOS_CERT_BASE64 != '' && secrets.MACOS_CERT_PASSWORD != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Detect macOS signing identity
        if: ${{ secrets.MACOS_CERT_BASE64 != '' && secrets.MACOS_CERT_PASSWORD != '' }}
        shell: bash
        run: |
          IDENTITY="$(security find-identity -v -p codesigning | awk -F'"' 'NR==1 {print $2}')"
          echo "APPLE_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build macOS package
        shell: bash
        run: chmod +x build_macos.sh && ./build_macos.sh

      - name: Upload macOS zip
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release/Voxify-v*-macos.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-dev pkg-config libasound2-dev

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt

      - name: Build Linux package
        shell: bash
        run: chmod +x build_linux.sh && ./build_linux.sh

      - name: Upload Linux zip
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/Voxify-v*-linux.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
      - build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-artifacts/**/*.zip
